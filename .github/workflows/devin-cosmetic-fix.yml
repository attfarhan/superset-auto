name: Devin Cosmetic Bug Fix

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  contents: read

jobs:
  validate-and-trigger:
    if: github.event.label.name == 'bug:cosmetic' || github.event.label.name == 'cosmetic-issue'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Validate issue and trigger Devin
        env:
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: python .github/scripts/devin_automation.py
